<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>List Food - DabbaCartel</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="listfood.css">

    <style>

       

        .list-food-page {
            max-width: 1000px;
            margin: 0 auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #777;
            font-size: 14px;
        }

        .food-form-card {
            background: white;
            border: 1px solid #e1e5e8;
            border-radius: 20px;
            padding: 30px;
        }

        .form-section-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #273202;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5dce0;
            border-radius: 10px;
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #536d1f;
            box-shadow: 0 0 0 3px rgba(83, 109, 31, 0.1);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .image-upload {
            border: 2px dashed #cbd3d7;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .image-upload:hover {
            border-color: #536d1f;
            background: #f8faf5;
        }

        .image-upload i {
            font-size: 35px;
            color: #536d1f;
            margin-bottom: 10px;
        }

        .image-upload p {
            color: #777;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .image-upload span {
            font-size: 12px;
            color: #aaa;
        }

        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .cancel-button,
        .submit-button {
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .cancel-button {
            background: #f1f3f4;
            color: #444;
            border: none;
        }

        .submit-button {
            background: #287849;
            color: white;
            border: none;
        }

        .submit-button:hover {
            background: #20623b;
        }

        .cancel-button:hover {
            background: #e5e8e9;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .form-row {
                grid-template-columns: 1fr;
            }

            .food-form-card {
                padding: 20px;
            }

            .form-buttons {
                flex-direction: column;
            }

            .cancel-button,
            .submit-button {
                width: 100%;
                text-align: center;
            }

        }

    </style>

    <link rel="stylesheet" href="../shared-layout.css">
</head>


<body>


<aside class="sidebar">
    <div class="logo-section">
        <div class="logo-icon">
            <img src="../logo.svg" alt="DabbaCartel Logo">
        </div>
        <div>
            <h2>DabbaCartel</h2>
            <p>No food waste, Just Goodness</p>
        </div>
    </div>
    <nav class="sidebar-menu">
        <a href="../Dashboard/dashboard.html" class="menu-item">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>
        <a href="../listfood/listfood.html" class="menu-item active">
            <i class="fa-solid fa-circle-plus"></i>
            <span>List food</span>
        </a>
        <a href="../mylisting/my-listings.html" class="menu-item">
            <i class="fa-solid fa-cube"></i>
            <span>My Listings</span>
        </a>
        <a href="../mybooking/mybookings.html" class="menu-item">
            <i class="fa-solid fa-box-open"></i>
            <span>My Bookings</span>
        </a>
        <a href="../messages/messages.html" class="menu-item">
            <i class="fa-regular fa-comment"></i>
            <span>Messages</span>
        </a>
        <a href="../profile/profile.html" class="menu-item">
            <i class="fa-regular fa-user"></i>
            <span>Profile</span>
        </a>
        <a href="#logout" class="menu-item logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>
    </nav>
</aside>


<!-- ================= MAIN CONTENT ================= -->

<main class="main-content">


    <header class="topbar">
    <div class="welcome-section">
        <button class="menu-button" type="button" aria-label="Toggle navigation">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div>
            <h1>List Food</h1>
            <p>Share your extra food and help someone in need.</p>
        </div>
    </div>
    <div class="topbar-right">
        <div class="notification">
            <i class="fa-regular fa-bell"></i>
        </div>
        <div class="profile-image">
            <i class="fa-solid fa-user"></i>
        </div>
    </div>
</header>


    <div class="list-food-page">
<!-- Form Card -->

        <div class="food-form-card">


            <h2 class="form-section-title">
                Food Details
            </h2>


            <form action="#list-food" method="POST"
                  enctype="multipart/form-data">


                <!-- Row 1 -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="food_name">
                            Food Name
                        </label>

                        <input
                            type="text"
                            id="food_name"
                            name="food_name"
                            placeholder="Example: Vegetable Biryani"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Food Category
                        </label>

                        <select
                            id="category"
                            name="category"
                            required>

                            <option value="">
                                Select category
                            </option>

                            <option value="Rice">
                                Rice
                            </option>

                            <option value="Roti">
                                Roti / Chapati
                            </option>

                            <option value="Vegetables">
                                Vegetables
                            </option>

                            <option value="Dal">
                                Dal
                            </option>

                            <option value="Snacks">
                                Snacks
                            </option>

                            <option value="Sweets">
                                Sweets
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Row 2 -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="quantity">
                            Quantity
                        </label>

                        <input
                            type="text"
                            id="quantity"
                            name="quantity"
                            placeholder="Example: 20 meals"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="expiry">
                            Best Before / Expiry
                        </label>

                        <input
                            type="datetime-local"
                            id="expiry"
                            name="expiry"
                            required>

                    </div>

                </div>


                <!-- Location -->

                <div class="form-row">


                    <div class="form-group full-width">

                        <label for="address">
                            Pickup Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            name="address"
                            placeholder="Enter pickup address"
                            required>

                    </div>

                </div>


                <!-- Description -->

                <div class="form-row">


                    <div class="form-group full-width">

                        <label for="description">
                            Food Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            placeholder="Tell us about the food..."></textarea>

                    </div>

                </div>


                <!-- Image -->

                <div class="form-row">


                    <div class="form-group full-width">

                        <label for="food_image">
                            Food Image
                        </label>


                        <label class="image-upload"
                               for="food_image">

                            <i class="fa-solid fa-cloud-arrow-up"></i>

                            <p>
                                Click to upload food image
                            </p>

                            <span>
                                JPG, JPEG or PNG
                            </span>

                        </label>


                        <input
                            type="file"
                            id="food_image"
                            name="food_image"
                            accept="image/png, image/jpeg"
                            hidden>

                    </div>

                </div>


                <!-- Buttons -->

                <div class="form-buttons">


                    <a href="../Dashboard/dashboard.html"
                       class="cancel-button">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="submit-button">

                        <i class="fa-solid fa-circle-plus"></i>

                        List Food

                    </button>

                </div>


            </form>

        </div>

    </div>


</main>


<script src="listfood.js"></script>
<script src="../shared-layout.js"></script>
<script src="../app.js"></script>
</body>

</html>
